<!--
  Favicon = die Bildmarke aus pv-aktuell-logo-light.png, als Vektor
  nachgezeichnet: abgerundetes Quadrat mit vier Modulfeldern, das linke
  obere in Logo-Gold.

  Geometrie 1:1 aus dem Logo-PNG ausgemessen (Marke dort 92x92 px):
  Außenkante 92, Innenabstand 8, Feldgröße 36, Fuge 4.

  Das "pv" aus dem Logo-Feld fehlt bewusst — bei 16 px Kantenlänge wird es
  zu einem grauen Fleck. Die Vier-Felder-Form bleibt auch dort lesbar.

  Farben aus dem Logo-File gemessen: #161616 Grundfläche, #252525 Felder,
  #D4950A Akzentfeld. Das ist NICHT das Akzent-Token #FF5200 der Website —
  das Logo trägt Gold, die Oberfläche Orange.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 92 92" width="92" height="92">
  <rect width="92" height="92" rx="20" fill="#161616" />
  <rect x="8" y="8" width="36" height="36" rx="8" fill="#D4950A" />
  <rect x="48" y="8" width="36" height="36" rx="8" fill="#252525" />
  <rect x="8" y="48" width="36" height="36" rx="8" fill="#252525" />
  <rect x="48" y="48" width="36" height="36" rx="8" fill="#252525" />
</svg>
